<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic · focused results</title>
<style>
:root{--ink:#24323d;--muted:#667783;--teal:#176e78;--line:#dce5e8;--paper:#f2f5f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,a,select{font:inherit}button{cursor:pointer}a{color:var(--teal)}header{background:white;border-bottom:1px solid var(--line);padding:22px 4vw 18px;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-size:27px;letter-spacing:-.035em;line-height:1.15;margin:4px 0 7px}h2{font-size:19px;margin:0 0 6px}p{margin:0}.eyebrow{color:var(--teal);font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:750}.muted{color:var(--muted)}.header-links{display:flex;gap:18px;font-size:12px;white-space:nowrap}main{max-width:1400px;margin:auto;padding:26px 4vw 40px}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.highlight{background:white;border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:8px;padding:19px 21px}.highlight h2{font-size:17px}.highlight p{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.section-head p{font-size:12px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}th{padding:12px 15px;background:#eaf0f1;color:#5b707b;font-size:10px;text-transform:uppercase;letter-spacing:.06em}td{padding:13px 15px;border-top:1px solid #e8edef;vertical-align:top}td:first-child{min-width:230px}td:last-child{min-width:260px;max-width:390px;color:var(--muted)}.run-link{border:0;background:none;color:var(--teal);padding:0;text-align:left;font-weight:650}.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);margin-top:4px}.good{color:#28684e}.bad{color:#9b4545}.warning{margin-top:20px;font-size:12px;max-width:1080px;color:var(--muted)}.viewer-bar{background:white;border-bottom:1px solid var(--line);padding:10px 3vw;display:flex;align-items:center;gap:14px}.viewer-bar select{max-width:500px;flex:1;min-width:120px;border:1px solid #b7c9ce;border-radius:5px;padding:7px;background:white;color:var(--ink)}.viewer-bar button{background:#eef6f5;border:1px solid #b7c9ce;color:var(--teal);border-radius:5px;padding:7px 12px}.viewer-bar a{font-size:12px}.view-note{padding:9px 3vw;background:#eaf1f2;color:#47626c;font-size:11px}iframe{display:block;border:0;width:100%;height:calc(100vh - 190px);min-height:650px;background:white}.error{padding:20px;color:#9b4545}[hidden]{display:none!important}footer{margin-top:25px;color:var(--muted);font-size:11px}@media(max-width:760px){header{align-items:start}.header-links{display:block}h1{font-size:23px}.highlights{grid-template-columns:1fr}.highlight{padding:15px}.section-head{display:block}.viewer-bar{flex-wrap:wrap}iframe{min-height:700px}.header-links a{display:block}}
</style></head><body>
<header><div><div class="eyebrow">Mosaic + VAE / saved experiments</div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><div class="header-links"><a id="all-history" target="_blank" rel="noopener">Full experiment history ↗</a><a href="collection-receipt.json">Report evidence</a></div></header>
<main id="overview"><div id="highlights" class="highlights"></div><div class="section-head"><div><h2>Selected experiments</h2><p class="muted">Choose a run to inspect its losses, saved molecules and probability heatmaps from update 0.</p></div><p id="count" class="muted"></p></div><div class="table-wrap"><table><thead><tr><th>Run</th><th>Updates</th><th>Final argmax</th><th>Valid samples</th><th>Comparison context</th></tr></thead><tbody id="run-table"></tbody></table></div><p id="comparison" class="warning"></p><footer id="footer"></footer></main>
<section id="viewer" hidden><div class="viewer-bar"><button id="back">← Overview</button><label for="run-select">Run</label><select id="run-select"></select><a id="standalone" target="_blank" rel="noopener">Open full view ↗</a></div><p id="view-note" class="view-note"></p><div id="error" class="error" role="alert" hidden></div><iframe id="frame" title="Saved experiment trajectory"></iframe></section>
<script>
const DATA=/*COLLECTION_DATA*/null;
const $=id=>document.getElementById(id), frame=$('frame');
const allowed=new Set(DATA.runs.filter(r=>r.renderer==='mosaic').map(r=>r.id));
function text(id,value){$(id).textContent=value}function element(tag,value){const x=document.createElement(tag);if(value!==undefined)x.textContent=value;return x}
text('title',DATA.title);text('subtitle',DATA.subtitle);$('all-history').href=DATA.full_report;text('count',DATA.runs.length+' runs · '+DATA.date);text('comparison',DATA.comparison_note);text('footer','Saved results only. No rescoring, repair, interpolation or new optimization. Older experiments are preserved in the full history. Mosaic '+DATA.edition+'.');
for(const row of DATA.highlights){const card=element('article');card.className='highlight';card.append(element('h2',row.title),element('p',row.body));$('highlights').append(card)}
for(const row of DATA.runs){const tr=element('tr'),cell=element('td'),button=element('button',row.label);button.className='run-link';button.onclick=()=>openRun(row.id);cell.append(button,element('br'));const tag=element('span',row.group);tag.className='tag';cell.append(tag);tr.append(cell,element('td','0–'+row.target.toLocaleString()));const valid=element('td',row.endpoint||'See trajectory');valid.className=row.endpoint==='Valid, connected'?'good':row.endpoint==='Invalid'?'bad':'';tr.append(valid,element('td',row.samples||'Not compared'),element('td',row.context));$('run-table').append(tr);const option=element('option',row.label);option.value=row.id;$('run-select').append(option)}
let active=null;
function openRun(id){const row=DATA.runs.find(r=>r.id===id);if(!row)return;active=row;$('overview').hidden=true;$('viewer').hidden=false;$('run-select').value=id;$('standalone').href=row.url;text('view-note',row.context+' '+(row.renderer==='external'?'VAE view preserves its original vocabulary, formal charges and saved latent trajectory. Its positive contact score is higher-better; Mosaic contact loss is negative and lower-better.':'Original scientific warnings and failed checks remain visible.'));$('error').hidden=true;frame.src=row.url;history.replaceState(null,'','#'+encodeURIComponent(id));window.scrollTo(0,0)}
frame.addEventListener('load',()=>{if(!active||active.renderer!=='mosaic')return;try{const doc=frame.contentDocument;const apply=()=>{const cards=doc.getElementById('arm-cards');if(cards)cards.hidden=true;const select=doc.getElementById('arm-select');if(select)for(const option of [...select.options])if(!allowed.has(option.value))option.remove()};apply();const observer=new MutationObserver(apply);const cards=doc.getElementById('arm-cards'),select=doc.getElementById('arm-select');if(cards)observer.observe(cards,{childList:true});if(select)observer.observe(select,{childList:true});const style=doc.createElement('style');style.textContent='main{margin:0 auto;box-shadow:none}.report-header{display:none}#arm-cards{display:none!important}.grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.grid>.stack,.stack>.card{min-width:0}.heatmaps{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:1000px){.grid{grid-template-columns:1fr}}@media(max-width:560px){.heatmaps{grid-template-columns:1fr}}';doc.head.append(style)}catch(error){$('error').hidden=false;text('error','Could not load the focused view: '+error.message)}});
$('run-select').onchange=event=>openRun(event.target.value);$('back').onclick=()=>{$('viewer').hidden=true;$('overview').hidden=false;frame.src='about:blank';active=null;history.replaceState(null,'',location.pathname);};
if(location.hash)openRun(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
