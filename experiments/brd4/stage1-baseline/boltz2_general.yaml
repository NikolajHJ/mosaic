# Example for Stages 0–2. Paths are relative to this YAML file.
model: boltz2
protein:
  structure: ../../../tests/data/brd4_3mxf/3MXF.pdb
  chain: A
  use_msa: false
boltz2:
  # Replace these paths with your own pinned worker environment and assets.
  worker_python: ../../../envs/boltz2/bin/python
  prepared_context: ../../../results/boltz2-brd4-25-context
  checkpoint: ../../../cache/boltz/boltz2_aff.ckpt
n_atoms: 25
initialization:
  random:
    carbon_probability: 0.75
    expected_degree: 2.25
    atom_noise: 0.005
    bond_noise: 0.005
epochs: 10
learning_rate: 0.03
seed: 17
output_dir: ../../../results/brd4-stage1-boltz2-short-01
