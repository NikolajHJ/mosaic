# Shared settings for the short BRD4 Stage 1 run. Paths are relative to this file.
model: protenix-tiny
model_cache: ../../../cache/protenix
protein:
  structure: ../../../tests/data/brd4_3mxf/3MXF.pdb
  chain: A
  use_msa: false
n_atoms: 25
initialization:
  random:
    carbon_probability: 0.75
    expected_degree: 2.25
    atom_noise: 0.005
    bond_noise: 0.005
epochs: 10
learning_rate: 0.03
seed: 17
output_dir: ../../../results/brd4-stage1-short-01
