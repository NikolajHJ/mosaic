# Stage 1 starts from a noisy, carbon-heavy graph with a fixed number of atoms.
# The only objective is Protenix-Tiny contact with the whole target domain.
stage: stage1
n_atoms: 25
initialization:
  carbon_probability: 0.75
  expected_degree: 2.25
  atom_noise: 0.005
  bond_noise: 0.005
readout_every: 5
# eta_X: 0.03  # Optional atom step size; otherwise use general learning_rate.
# eta_E: 0.03  # Optional bond step size; otherwise use general learning_rate.
