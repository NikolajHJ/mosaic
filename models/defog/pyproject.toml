[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic-defog"
version = "0.1.0"
description = "Frozen DeFoG molecular guidance for independently chosen optimizers and projections"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
jax = ["jax>=0.4.35"]
torch = ["torch>=2.1"]
test = ["pytest>=8", "jax>=0.4.35"]

[project.scripts]
mosaic-defog = "mosaic_defog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_defog"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "mosaic_defog/THIRD_PARTY.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["native: requires the official source, checkpoint and teacher interpreter"]
